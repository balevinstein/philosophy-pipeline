[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "philosophy-pipeline"
version = "1.0.0"
description = "AI-Driven Philosophy Paper Generator - A system that generates complete publishable-quality analytic philosophy papers through a structured multi-phase development pipeline"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Philosophy Pipeline Team", email = "team@philosophy-pipeline.org"}
]
maintainers = [
    {name = "Philosophy Pipeline Team", email = "team@philosophy-pipeline.org"}
]
keywords = ["philosophy", "ai", "paper-generation", "academic", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Education",
]
requires-python = ">=3.8"
dependencies = [
    "anthropic>=0.43.0",
    "openai>=1.59.7",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "pydantic>=2.10.5",
    "click>=8.1.8",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.10.2",
    "pdfminer.six>=20221105",
    "httpx>=0.28.1",
    "requests>=2.32.3",
    "tenacity>=9.0.0",
    "markdownify>=0.14.1",
    "beautifulsoup4>=4.13.3",
    "pathlib>=1.0.1",
    "typing_extensions>=4.12.2",
    "tiktoken>=0.9.0",
    "psutil",
    "tqdm>=4.67.1",
    "tavily-python>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pandas>=2.2.3",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "lxml>=5.3.1",
    "puremagic>=1.28",
    "looseversion>=1.3.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]

# CLI entry point - commented out until we fix the import structure
# [project.scripts]
# philosophy-pipeline = "pipeline_cli:main"

[project.urls]
Homepage = "https://github.com/balevinstein/philosophy-pipeline"
Documentation = "https://philosophy-pipeline.readthedocs.io/"
Repository = "https://github.com/balevinstein/philosophy-pipeline.git"
Issues = "https://github.com/balevinstein/philosophy-pipeline/issues"
Changelog = "https://github.com/balevinstein/philosophy-pipeline/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "archive",
    "outputs",
    "papers",
    "sample_output_papers",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "pdfplumber.*",
    "pypdfium2.*",
    "tavily.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "cli: marks tests as CLI tests",
    "pipeline: marks tests as pipeline tests",
]
